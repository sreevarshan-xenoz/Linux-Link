[package]
name = "linux-link-core"
version.workspace = true
edition.workspace = true

[features]
default = ["server"]

# Linux server features
server = ["capture", "encode", "injection", "opus"]
capture = [
    "dep:ashpd",
    "dep:pipewire",
    "dep:libspa",
    "dep:x11rb",
    "dep:xcap",
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
    "wayland-portal",
]
encode = ["dep:ffmpeg-sidecar", "dep:ffmpeg-next"]
injection = ["dep:evdev"]
wayland-portal = ["ashpd?/screencast"]
x11-capture = ["dep:xcap"]

# Client-only (Android) features
client = []

# WAN transport (R1 stage 2): iroh (noq) implementation of the streaming
# connection traits. Opt-in so neither the default build nor the Android
# bridge pulls iroh into the graph.
wan = ["dep:iroh"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing.workspace = true
uuid.workspace = true
async-trait.workspace = true
rand = "0.8"

# Screen capture (Linux-only, optional)
ashpd = { workspace = true, optional = true }
pipewire = { workspace = true, optional = true }
libspa = { workspace = true, optional = true }
x11rb = { version = "0.13", features = ["shm"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = [
    "client",
], optional = true }
tokio-util.workspace = true

# Audio encoding (server-only — Android client only decodes raw Opus packets)
opus = { workspace = true, optional = true }

# Video encoding (Linux-only, optional)
ffmpeg-sidecar = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }

# mDNS service discovery
mdns-sd = "0.13"

# Certificate hashing for TOFU verification
sha2 = "0.10"

# Unix-specific utilities
libc.workspace = true

# QUIC streaming
quinn.workspace = true

# WAN QUIC streaming via iroh (behind the `wan` feature)
iroh = { version = "1.2", optional = true }

# TLS and certificates for QUIC
rcgen.workspace = true
rustls.workspace = true

# X11 screen capture fallback (optional)
xcap = { workspace = true, optional = true }

# Input injection via uinput (Linux-only, optional)
evdev = { workspace = true, optional = true }

# Directories / home paths
dirs.workspace = true
